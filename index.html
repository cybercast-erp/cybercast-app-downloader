<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cybercast Update</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        /* PairEmptyScreen: diagonal gradient + dot grid */
        background: #e0f2fe;
        background-image: radial-gradient(
            circle,
            rgba(211, 211, 211, 0.4) 1px,
            transparent 1.5px
          ),
          linear-gradient(135deg, #bfdbfe, #e0f2fe, #c7d2fe);
        background-size:
          20px 20px,
          100% 100%;
        color: #1d1b20;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        overflow: hidden;
      }
      #screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        text-align: center;
      }
      #brand {
        width: 300px;
        max-width: 70%;
        margin-bottom: 32px;
      }
      #status {
        font-size: 22px;
        font-weight: 400;
        color: #475569;
        min-height: 30px;
      }
      #spinner {
        margin: 26px auto 0 auto;
        width: 34px;
        height: 34px;
        border: 3px solid #e0f2fe;
        border-top-color: #00bce4;
        border-radius: 50%;
        -webkit-animation: spin 1s linear infinite;
        animation: spin 1s linear infinite;
      }
      #spinner.hidden {
        display: none;
      }
      @-webkit-keyframes spin {
        to {
          -webkit-transform: rotate(360deg);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #installBtn {
        display: none;
        margin-top: 30px;
        padding: 16px 44px;
        font-size: 20px;
        color: #ffffff;
        background: #00bce4;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      #installBtn:active {
        background: #0e7490;
      }
      #corner {
        position: absolute;
        right: 12px;
        bottom: 10px;
        font-size: 12px;
        color: #7a757f;
      }
      #simFlag {
        position: absolute;
        left: 12px;
        bottom: 10px;
        font-size: 12px;
        color: #7a757f;
        display: none;
      }
      #logPanel {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 40%;
        overflow-y: auto;
        background: rgba(30, 41, 59, 0.92);
        color: #e2e8f0;
        font-family: monospace;
        font-size: 11px;
        line-height: 1.5;
        padding: 6px 10px 26px 10px;
        white-space: pre-wrap;
        word-break: break-all;
        display: none;
      }
      #logPanel .err {
        color: #ff8a80;
      }
    </style>
  </head>

    <script>
      /* Cybercast APK self-update — ES5 only (Chrome 39 WebView) */
      (function () {
        "use strict";

        /* cybdevice.2.2.1.js loads as a sibling file; if it failed
	   (offline, 404), we cannot talk to the device — retry by reloading. */
        if (!window.Device) {
          document.getElementById("status").innerHTML =
            "Device bridge failed to load &mdash; retrying&hellip;";
          setTimeout(function () {
            window.location.reload();
          }, 30000);
          return;
        }

        /* Static, query-less URL: the legacy player derives the local file
	   name from everything after the last "/" in the URL, so presigned
	   URLs (with their ~1.5KB query string) exceed the 255-byte filename
	   limit and every download fails. */
        var APK_URL =
          "https://media-manager-bucket-dev.s3.ap-southeast-2.amazonaws.com/com.cybercast-3155.apk";
        var APK_VERSION = 3155;
        var PACKAGE_NAME = "com.cybercast";
        var RECHECK_MS = 6 * 60 * 60 * 1000; /* 6 hours */
        var INSTALL_WATCHDOG_MS = 15 * 60 * 1000; /* 15 minutes */
        var BACKOFF_STEPS = [30, 60, 120, 240, 300]; /* seconds */

        var manualMode = /[?&]manual=1(&|$)/.test(window.location.search);
        var debugMode = /[?&]debug=1(&|$)/.test(window.location.search);
        var attempt = 0;
        var retryTimer = null;
        var countdownTimer = null;
        var watchdogTimer = null;
        var installDone = false;
        var installing = false;

        var statusEl = document.getElementById("status");
        var spinnerEl = document.getElementById("spinner");
        var cornerEl = document.getElementById("corner");
        var buttonEl = document.getElementById("installBtn");
        var simFlagEl = document.getElementById("simFlag");
        var logPanelEl = document.getElementById("logPanel");

        function showLogs() {
          logPanelEl.style.display = "block";
        }

        function pad2(n) {
          return (n < 10 ? "0" : "") + n;
        }

        function uiLog(msg, isError) {
          var d = new Date();
          var line = document.createElement("div");
          if (isError) line.className = "err";
          line.appendChild(
            document.createTextNode(
              pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()) + " " + msg
            )
          );
          logPanelEl.appendChild(line);
          while (logPanelEl.childNodes.length > 200) {
            logPanelEl.removeChild(logPanelEl.firstChild);
          }
          logPanelEl.scrollTop = logPanelEl.scrollHeight;
          /* errors force the panel open, even without ?debug=1 */
          if (isError) showLogs();
        }

        function log(msg) {
          uiLog(msg, false);
          try {
            Device.log("[apk-updater] " + msg, true);
          } catch (e) {}
        }

        function logError(msg) {
          uiLog(msg, true);
          try {
            Device.logError("[apk-updater] " + msg);
          } catch (e) {}
        }

        function setStatus(text, busy) {
          statusEl.innerHTML = text;
          spinnerEl.className = busy ? "" : "hidden";
        }

        function setCorner(latestVersion) {
          var current = currentVersion();
          var parts = [];
          parts.push("installed v" + (current > 0 ? current : "?"));
          if (latestVersion) parts.push("latest v" + latestVersion);
          if (Device.info && Device.info.device_name) parts.push(Device.info.device_name);
          cornerEl.innerHTML = parts.join(" &middot; ");
        }

        function currentVersion() {
          var v = parseInt(Device.info && Device.info.app_ver_code, 10);
          return isNaN(v) ? 0 : v;
        }

        function clearTimers() {
          if (retryTimer) {
            clearTimeout(retryTimer);
            retryTimer = null;
          }
          if (countdownTimer) {
            clearInterval(countdownTimer);
            countdownTimer = null;
          }
          if (watchdogTimer) {
            clearTimeout(watchdogTimer);
            watchdogTimer = null;
          }
        }

        function checkForUpdate(installIfBehind) {
          clearTimers();
          setStatus("Checking for updates&hellip;", true);
          log("checking for updates (installed v" + currentVersion() + ")");

          setCorner(APK_VERSION);
          if (currentVersion() >= APK_VERSION) {
            upToDate(APK_VERSION);
          } else if (installIfBehind) {
            install();
          } else {
            /* manual mode: offer the button */
            setStatus("Update available: v" + APK_VERSION, false);
            buttonEl.style.display = "inline-block";
            log("update available v" + APK_VERSION + " (manual mode, waiting for tap)");
          }
        }

        function install() {
          var resp = { packageName: PACKAGE_NAME, downloadUrl: APK_URL, version: APK_VERSION };
          if (!Device.isDeviceRunning()) {
            setStatus(
              "Update available: v" + resp.version + " (not installing &mdash; no device)",
              false
            );
            log("simulation mode: would install v" + resp.version + " from " + resp.downloadUrl);
            scheduleRecheck();
            return;
          }

          setStatus("Downloading &amp; installing update&hellip;", true);
          log("installing " + resp.packageName + " v" + resp.version);
          installing = true;
          try {
            Device.keepActive(true);
          } catch (e) {}

          armWatchdog();

          Device.installApk(
            {
              package: resp.packageName,
              url: resp.downloadUrl,
              apk_version: resp.version,
              auto_run: true,
              /* when the privileged com.cybercast.service app is on the
	         device, the player delegates to it and installs silently
	         (no Android prompt). Ignored when the service is absent. */
              use_service: true,
            },
            function (result) {
              if (!installing) {
                log("ignored late callback: " + result);
                return;
              }
              installing = false;
              installDone = true;
              clearTimers();
              if (result === "installed") {
                log("already installed at v" + resp.version);
                upToDate(resp.version);
              } else {
                log("install success (v" + resp.version + "), app restarting");
                setStatus("Update installed &mdash; restarting&hellip;", true);
              }
            },
            function (result) {
              if (!installing) {
                log("ignored late callback: " + result);
                return;
              }
              /* the player reports progress through this callback too:
	         cybdevice routes every status that is not "success" /
	         "installed" here, including "downloading" and "downloaded".
	         Treating those as failures caused overlapping install
	         attempts that corrupted the in-progress download. */
              if (result === "downloading") {
                setStatus("Downloading update&hellip;", true);
                log("device: downloading");
                armWatchdog();
                return;
              }
              if (result === "downloaded") {
                setStatus("Installing update&hellip;", true);
                log("device: download complete, installing (may take several minutes)");
                armWatchdog();
                return;
              }
              installing = false;
              installDone = true;
              clearTimers();
              scheduleRetry("install failed: " + result, true);
            }
          );
        }

        function armWatchdog() {
          if (watchdogTimer) clearTimeout(watchdogTimer);
          watchdogTimer = setTimeout(function () {
            if (!installDone) {
              scheduleRetry(
                "install watchdog expired (" + INSTALL_WATCHDOG_MS / 60000 + " min, no callback)",
                true
              );
            }
          }, INSTALL_WATCHDOG_MS);
        }

        function upToDate(latestVersion) {
          attempt = 0;
          setStatus("Up to date (v" + latestVersion + ")", false);
          log("up to date at v" + latestVersion);
          scheduleRecheck();
        }

        function scheduleRecheck() {
          clearTimers();
          retryTimer = setTimeout(function () {
            checkForUpdate(!manualMode);
          }, RECHECK_MS);
        }

        function scheduleRetry(reason, installIfBehind) {
          clearTimers();
          installDone = false;
          installing = false;
          var delay = BACKOFF_STEPS[Math.min(attempt, BACKOFF_STEPS.length - 1)];
          attempt++;
          logError(reason + " — retry #" + attempt + " in " + delay + "s");

          var remaining = delay;
          setStatus("Retrying in " + remaining + "s&hellip;", false);
          countdownTimer = setInterval(function () {
            remaining--;
            if (remaining > 0) {
              setStatus("Retrying in " + remaining + "s&hellip;", false);
            }
          }, 1000);
          retryTimer = setTimeout(function () {
            checkForUpdate(installIfBehind);
          }, delay * 1000);
        }

        buttonEl.onclick = function () {
          buttonEl.style.display = "none";
          attempt = 0;
          checkForUpdate(true);
        };

        window.onerror = function (msg, src, line) {
          logError("js error: " + msg + " @" + line);
        };

        if (debugMode) showLogs();

        Device.ready(function () {
          if (!Device.isDeviceRunning()) {
            simFlagEl.style.display = "block";
          }
          try {
            log(
              "device ready: " +
                (Device.info
                  ? "app_ver_code=" +
                    Device.info.app_ver_code +
                    " device=" +
                    Device.info.device_name +
                    " os=" +
                    Device.info.platform_ver
                  : "no Device.info")
            );
          } catch (e) {}
          logInstallerService();
          setCorner(null);
          checkForUpdate(!manualMode);
        });

        /* diagnostic: silent install needs the privileged
	   com.cybercast.service app. Probing installApk with no URL
	   answers "installed"/"disabled" when the package exists and
	   stays silent when it does not. */
        function logInstallerService() {
          if (!Device.isDeviceRunning()) return;
          var answered = false;
          var probeTimer = setTimeout(function () {
            if (!answered) {
              logError("com.cybercast.service NOT detected: Android will prompt for install");
            }
          }, 8000);
          function onProbe(status) {
            answered = true;
            clearTimeout(probeTimer);
            if (status === "installed") {
              log("com.cybercast.service present: updates should install silently");
            } else {
              logError("com.cybercast.service is " + status + ": silent install unavailable");
            }
          }
          try {
            Device.installApk({ package: "com.cybercast.service" }, onProbe, onProbe);
          } catch (e) {}
        }
      })();
    </script>
  </body>
</html>
